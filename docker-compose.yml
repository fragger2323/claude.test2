# Single-server production stack: PostgreSQL + one-shot migrations + API + worker.
#   cp .env.example .env    # set APP_ENCRYPTION_KEY, SETUP_TOKEN, APP_URL, provider keys
#   POSTGRES_PASSWORD=... docker compose up -d --build
# The API listens on 127.0.0.1:4000 — put a TLS reverse proxy (Caddy/nginx) in front of it.
x-app: &app
  build: .
  image: agency-intelligence-os:local
  env_file:
    - path: .env
      required: false
  environment: &app-env
    NODE_ENV: production
    DATABASE_URL: postgresql://aios:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/aios?schema=public
    HOST: 0.0.0.0
    PORT: "4000"
    DATA_DIR: /data
    # Chromium's own sandbox for analysed pages (needs the seccomp profile below).
    BROWSER_SANDBOX: "true"
  security_opt:
    - seccomp=./deploy/seccomp-chromium.json
  volumes:
    - appdata:/data
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aios
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: aios
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aios -d aios"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["npx", "prisma", "migrate", "deploy", "--schema", "prisma/postgres/schema.prisma"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *app-env
      RUN_WORKER_IN_PROCESS: "false"
      # Behind exactly one reverse proxy on this host:
      TRUST_PROXY: ${TRUST_PROXY:-1}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["node", "dist/server/worker.js"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  appdata:
